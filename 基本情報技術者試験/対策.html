<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>基本情報技術者対策</title>
<style>
  body { font-family: Arial; text-align: center; padding: 20px; background-color: #f4f4f9; }
  #titleScreen, #quizScreen { padding: 20px; border: 1px solid #ccc; border-radius: 10px; background: white; max-width: 600px; margin: auto; }
  #word { font-size: 2.2em; font-weight: bold; margin: 20px 0; color: #333; }
  
  #meanings-container { 
    text-align: center; 
    margin: 15px auto;
    width: 100%;
    height: 250px;      /* ★高さを固定（お好みで調整してください） */
    overflow-y: auto;   /* ★文字が多い時は枠内でスクロール */
    border: 1px inset #f0f0f0; /* 枠をうっすら付けて場所をわかりやすく */
    background: #ffffff;
    border-radius: 5px;
  }

  #meanings { 
    font-size: 1.3em; 
    padding: 15px;      /* 内側に余白 */
    line-height: 1.6; 
    white-space: pre-wrap; 
    text-align: left; 
    display: block;     /* inline-blockから変更 */
    visibility: hidden;
  }

  button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: 1px solid #999; background: #eee; margin: 5px; }
  #startBtn, #nextBtn, #showBtn { background: #4CAF50; color: white; border: none; font-size: 1.2em; }
  #nextBtn, #showBtn { background: #2196F3; }
  /* 2カラムレイアウト用 */
  .selection-container {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    gap: 20px;
    margin: 20px 0;
    padding: 15px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
  }
  .column {
    flex: 1;
    text-align: left;
    padding: 0 10px;
  }
  .column h3 {
    font-size: 1.1em;
    margin-bottom: 10px;
    border-left: 5px solid #4CAF50;
    padding-left: 10px;
  }
  .column label {
    display: block;
    margin-bottom: 5px;
    cursor: pointer;
  }

  #status-line { 
    display: flex; 
    justify-content: space-between; 
    margin: 15px; 
    font-size: 1.1em; 
    color: #666;
    border-bottom: 1px solid #eee;
    padding-bottom: 5px;
  }
</style>
</head>
<body>

<h1>基本情報技術者試験対策-頻出問題</h1>

<div id="titleScreen">
  <div class="selection-container">
    <!-- 左カラム：分野選択（チェックボックス） -->
    <div class="column">
      <h3>① 分野を選んでね！</h3>
      <label><input type="checkbox" class="fieldCheck" value="テクノロジ系" checked> テクノロジ系</label>
      <label><input type="checkbox" class="fieldCheck" value="ストラテジ系" checked> ストラテジ系</label>
      <label><input type="checkbox" class="fieldCheck" value="マネジメント系" checked> マネジメント系</label>
      <label><input type="checkbox" class="fieldCheck" value="ITパスポート" checked> ITパスポート</label>
      <label><input type="checkbox" class="fieldCheck" value="グラフあれこれ" checked> グラフあれこれ</label>
      <button id="allTrueBtn" style="font-size: 0.8em;">全選択</button>
      <button id="allFalseBtn" style="font-size: 0.8em;">全解除</button>

    <!-- 出題順 -->
      <hr>
      <h3>② 出題順を選んでね！</h3>
      <label><input type="radio" name="orderSelect" value="random" checked> ランダム</label>
      <label><input type="radio" name="orderSelect" value="sequence"> 順番通り</label>
    </div>

    <!-- 右カラム：ファイル選択（ラジオボタン） -->
    <div class="column">
      <h3>③ ファイルを選んでね！</h3>
      <label><input type="radio" name="csvSelect" value=".\ファイル\(´・ω・`)ry.csv" checked> (´・ω・`)ry</label>
      <label><input type="radio" name="csvSelect" value=".\ファイル\(´・ω・`)英語ﾑﾘ.csv"> (´・ω・`)英語ﾑﾘ</label>
      <label><input type="radio" name="csvSelect" value=".\ファイル\(´・ω・`)ｳﾘｳﾘ.csv"> (´・ω・`)ｳﾘｳﾘ</label>
      <label style="color:red; font-weight: bold;"><input type="radio" name="csvSelect" color="red" value=".\ファイル\(´・ω・`)ｽﾞｹｲ.csv"> (´・ω・`)ｽﾞｹｲ (要修正)</label>
      <label><input type="radio" name="csvSelect" value=".\ファイル\(´・ω・`)ｺｳｼｷｨ.csv"> (´・ω・`)ｺｳｼｷｨ</label>

      <p style="font-size: 4.0em"></p>
      <hr>
      <p style="font-size: 0.8em; color: #666;">その他ファイル：</p>
      <input type="file" id="csvFile" accept=".csv" style="width: 100%; font-size: 0.8em;" />
    </div>


  </div>

  <button id="startBtn">スタート！</button>
</div>

<div id="quizScreen" style="display:none;">
  <div id="status-line">
    <div id="progress">問題 0 / 0</div>
    <div id="currentField" style="font-weight: bold; color: #4CAF50;">---</div>
  </div>
  
  <div id="word">---</div>
  <div id="meanings-container">
    <div id="meanings">---</div>
  </div>
  <button id="showBtn">答えを表示</button>
  <button id="nextBtn" style="display:none;">次の問題</button>
  <button id="restartBtn">タイトルへ</button>
</div>

<script>
let allData = [];
let quizData = [];
let currentIndex = 0;
let shuffledIndices = [];
let activeTimers = [];

// 【CSVテキストを解析して、扱いやすい配列データに変換する】
// カンマやセミコロン、セル内の改行、引用符（"）などの複雑な形式に対応しています。
function parseCSV(text) {
  const rows = [];
  let currentRow = [];
  let currentField = '';
  let inQuotes = false;
  const cleanText = text.replace(/^\ufeff/, "").trim();
  const delimiter = cleanText.includes(';') && !cleanText.includes(',') ? ';' : ',';

  for (let i = 0; i < cleanText.length; i++) {
    const char = cleanText[i];
    const nextChar = cleanText[i + 1];
    if (char === '"' && inQuotes && nextChar === '"') {
      currentField += '"'; i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === delimiter && !inQuotes) {
      currentRow.push(currentField.trim().replace(/^"|"$/g, ''));
      currentField = '';
    } else if ((char === '\n' || char === '\r') && !inQuotes) {
      if (currentField !== '' || currentRow.length > 0) {
        currentRow.push(currentField.trim().replace(/^"|"$/g, ''));
        rows.push(currentRow);
        currentRow = [];
        currentField = '';
      }
      if (char === '\r' && nextChar === '\n') i++;
    } else {
      currentField += char;
    }
  }
  if (currentField !== '' || currentRow.length > 0) {
    currentRow.push(currentField.trim().replace(/^"|"$/g, ''));
    rows.push(currentRow);
  }
  allData = rows.filter(cols => cols.length >= 2).map(cols => ({
    field: cols[0], word: cols[1], meanings: cols.slice(2)
  }));
}

// 【ページ読み込み時にサーバー上のCSVファイルを自動で取得する】
fetch("基本情報技術者対策.csv")
  .then(res => res.text()).then(text => parseCSV(text))
  .catch(() => console.log("自動読み込みなし"));

// 【ユーザーが手動で選択したCSVファイルを読み込む】
  document.getElementById('csvFile').onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => { parseCSV(reader.result); alert("読み込み成功！"); };
  reader.readAsText(file);
};

// 【役割：スタートボタン押下時に、選択されたファイルを自動読込してからクイズを開始する】
document.getElementById('startBtn').onclick = async () => {
  // 1. 現在ラジオボタンで選ばれているファイル名を取得
  const selectedRadio = document.querySelector('input[name="csvSelect"]:checked');
  const fileName = selectedRadio ? selectedRadio.value : "";

  // 2. ファイルを読みに行く（ネットワーク経由）
  try {
    const response = await fetch(fileName);
    
    // ファイルが存在しない（404など）場合のエラー表示
    if (!response.ok) {
      throw new Error(`今【${fileName}】ファイルを探しみたがなかったよ！`);
    }

    const text = await response.text();
    parseCSV(text); // CSVを解析して allData に入れる

    // 解析後のデータが空（ファイルの中身に不備がある等）の場合
    if (allData.length === 0) {
      alert(`今【${fileName}】ファイルを探しみたがなかったよ！\n(データが読み込めませんでした)`);
      return;
    }

    // 3. 分野のフィルタリング（チェックボックスの確認）
    const checkedFields = Array.from(document.querySelectorAll('.fieldCheck'))
                               .filter(c => c.checked).map(c => c.value);
    
    quizData = allData.filter(d => checkedFields.includes(d.field));
    
    if (quizData.length === 0) {
      alert(`選んだ分野が【${fileName}】の中にファイルがないと思うよな！\n1列目の文字を確認してみて！`);
      return;
    }

    // 4. シャッフルして画面切り替え
    // 【役割：選ばれた出題順（ランダム or 順番通り）に基づいてインデックスを作成する】
    const orderType = document.querySelector('input[name="orderSelect"]:checked').value;
    
    // 基本のインデックス配列 [0, 1, 2, ...] を作成
    shuffledIndices = [...Array(quizData.length).keys()];

    if (orderType === "random") {
      // ランダムならシャッフルする
      shuffledIndices.sort(() => Math.random() - 0.5);
    } 
    // "sequence" の場合は sort しないのでそのままの順になる

    currentIndex = 0;
    document.getElementById('titleScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display = 'block';
    showQuestion();
    
    document.getElementById('titleScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display = 'block';
    showQuestion();

  } catch (err) {
    // fetch失敗（オフラインやファイル未アップロード）時にアラートを出す
    alert(err.message);
  }
}


// 【現在の問題情報を画面に表示し、回答エリアをリセット（隠蔽）する】
function showQuestion() {
  // 実行中の色変化タイマーを停止
  activeTimers.forEach(id => clearTimeout(id));
  activeTimers = [];

  if (currentIndex >= shuffledIndices.length) {
    document.getElementById('word').textContent = "終了！";
    document.getElementById('meanings').innerHTML = "";
    document.getElementById('showBtn').style.display = "none";
    document.getElementById('nextBtn').style.display = "none";
    return;
  }

  const data = quizData[shuffledIndices[currentIndex]];

  document.getElementById('word').innerHTML = data.word.replace(/\n/g, '<br>');
  document.getElementById('currentField').textContent = `[${data.field}]`;
  document.getElementById('progress').textContent = `問題 ${currentIndex + 1} / ${quizData.length}`;

  const meaningsDiv = document.getElementById('meanings');
  meaningsDiv.innerHTML = data.meanings.map(m => m.replace(/\n/g, '<br>'))
      .join('<hr style="border:0; border-top:5px dashed #ddd; margin:15px 0">');

  // 表示のリセット（答えを隠す）
  meaningsDiv.style.visibility = "hidden";
  meaningsDiv.style.transition = "none";
  meaningsDiv.style.color = "white";

  document.getElementById('showBtn').style.display = "inline-block";
  document.getElementById('nextBtn').style.display = "none";
}

// 【答えを表示し、指定の秒数（1秒刻み）で段階的に色を濃くするアニメーションを開始する】
document.getElementById('showBtn').onclick = () => {
  const meaningsDiv = document.getElementById('meanings');
  meaningsDiv.style.visibility = "visible";
  document.getElementById('showBtn').style.display = "none";
  document.getElementById('nextBtn').style.display = "inline-block";

  const steps = ["#00000033", "#00000088", "#000000"]; 
  steps.forEach((color, i) => {
    const tId = setTimeout(() => {
      meaningsDiv.style.transition = "color 0.4s ease";
      meaningsDiv.style.color = color;
    }, 1000 * (i + 1));
    activeTimers.push(tId);
  });
}

// 【インデックスを進めて次の問題へ移行する】
document.getElementById('nextBtn').onclick = () => {
  currentIndex++;
  showQuestion();
}

document.getElementById('restartBtn').onclick = () => location.reload();

// 【分野選択のチェックボックスを一括操作する】
document.getElementById('allTrueBtn').onclick = () => document.querySelectorAll('.fieldCheck').forEach(c => c.checked = true);
document.getElementById('allFalseBtn').onclick = () => document.querySelectorAll('.fieldCheck').forEach(c => c.checked = false);
</script>

</body>
</html>
